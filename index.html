<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小知識庫</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6feb">
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --line: #30363d;
    --text: #e6edf3;
    --muted: #7d8590;
    --primary: #1f6feb;
    --green: #238636;
    --orange: #d29922;
    --red: #da3633;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Noto Sans TC", system-ui, sans-serif;
    font-size: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
  }
  h1 { font-size: 20px; margin: 8px 0 16px; }
  .field { margin-bottom: 14px; }
  label {
    display: block;
    margin-bottom: 6px;
    color: var(--muted);
    font-size: 14px;
  }
  input[type="text"], input[type="url"], textarea {
    width: 100%;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 80px; }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
  }
  .cat-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .cat-btn {
    padding: 14px 8px;
    border: 2px solid var(--line);
    background: var(--card);
    color: var(--text);
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .cat-btn.active[data-cat="新知"]     { border-color: var(--primary); background: rgba(31,111,235,.15); }
  .cat-btn.active[data-cat="待處理"]   { border-color: var(--orange);  background: rgba(210,153,34,.15); }
  .cat-btn.active[data-cat="待執行"]   { border-color: var(--green);   background: rgba(35,134,54,.15);  }
  .submit {
    width: 100%;
    padding: 16px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
  .submit:disabled { opacity: .5; cursor: not-allowed; }
  .toast {
    position: fixed;
    left: 50%; bottom: 24px;
    transform: translateX(-50%);
    padding: 12px 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 14px;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
    max-width: 90vw;
  }
  .toast.show { opacity: 1; }
  .toast.ok  { border-color: var(--green); }
  .toast.err { border-color: var(--red); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 小知識庫</h1>

  <div class="field">
    <label>分類</label>
    <div class="cat-row">
      <button type="button" class="cat-btn" data-cat="新知">新知</button>
      <button type="button" class="cat-btn" data-cat="待處理">待處理</button>
      <button type="button" class="cat-btn" data-cat="待執行">待執行</button>
    </div>
  </div>

  <div class="field">
    <label>網址 *</label>
    <input type="url" id="url" placeholder="https://..." autocomplete="off">
  </div>

  <div class="field">
    <label>標題（可空）</label>
    <input type="text" id="title" placeholder="可留空，之後 Sheets 補">
  </div>

  <div class="field">
    <label>備註（可空）</label>
    <textarea id="note" placeholder="想記住的重點、為什麼想看..."></textarea>
  </div>

  <button class="submit" id="submit">新增到 Sheets</button>
  <p class="hint">提交後會直接寫入 Google Sheets 對應 sheet 最後一列。</p>
</div>

<div class="toast" id="toast"></div>

<script>
  // 部署 Apps Script 後把這裡換成你的 Web App URL
  const API_URL = "REPLACE_WITH_YOUR_APPS_SCRIPT_URL";

  // TOKEN 不寫在 source code，第一次開網頁時 prompt 輸入並存 localStorage
  // 必須和 Code.gs 裡的 SHARED_TOKEN 一致
  function getToken() {
    let t = localStorage.getItem("token");
    if (!t) {
      t = prompt("第一次使用，請輸入授權密鑰（之後會記住）：");
      if (t) {
        t = t.trim();
        localStorage.setItem("token", t);
      }
    }
    return t || "";
  }

  let currentCat = "新知";

  // 還原上次選擇
  const saved = localStorage.getItem("lastCat");
  if (saved) currentCat = saved;

  function refreshCat() {
    document.querySelectorAll(".cat-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.cat === currentCat);
    });
  }
  document.querySelectorAll(".cat-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentCat = btn.dataset.cat;
      localStorage.setItem("lastCat", currentCat);
      refreshCat();
    });
  });
  refreshCat();

  function toast(msg, type = "") {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = "toast show " + type;
    setTimeout(() => el.classList.remove("show"), 2400);
  }

  document.getElementById("submit").addEventListener("click", async () => {
    const url = document.getElementById("url").value.trim();
    const title = document.getElementById("title").value.trim();
    const note = document.getElementById("note").value.trim();
    if (!url) { toast("網址必填", "err"); return; }
    const token = getToken();
    if (!token) { toast("尚未設定授權密鑰", "err"); return; }

    const btn = document.getElementById("submit");
    btn.disabled = true; btn.textContent = "送出中...";

    try {
      // 用 text/plain 避免 CORS preflight（Apps Script 限制）
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ token, category: currentCat, url, title, note })
      });
      const json = await res.json();
      if (json.ok) {
        toast("✅ 已加到「" + currentCat + "」", "ok");
        document.getElementById("url").value = "";
        document.getElementById("title").value = "";
        document.getElementById("note").value = "";
      } else {
        toast("❌ " + (json.error || "未知錯誤"), "err");
        if (json.error === "未授權") {
          localStorage.removeItem("token");
        }
      }
    } catch (err) {
      toast("❌ 連線失敗: " + err.message, "err");
    } finally {
      btn.disabled = false; btn.textContent = "新增到 Sheets";
    }
  });
</script>
</body>
</html>
